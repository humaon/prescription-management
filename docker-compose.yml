services:
  mongodb:
    image: mongo:7
    container_name: auth-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: authdb

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: prescription-api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "3050:3000"
    # All secrets (Gemini, Cloudinary, Firebase, SMTP, JWT...) live in .env, which is git-ignored.
    env_file:
      - .env
    # Only container-specific values are overridden here.
    environment:
      NODE_ENV: development
      PORT: "3000"
      MONGO_URI: mongodb://admin:admin123@mongodb:27017/authdb?authSource=admin
      GOOGLE_CALLBACK_URL: "http://localhost:3050/api/auth/google/callback"
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads

volumes:
  mongo_data:

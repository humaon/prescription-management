version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: auth-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: authdb

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: prescription-api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "3050:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      MONGO_URI: mongodb://admin:admin123@mongodb:27017/authdb?authSource=admin
      JWT_SECRET: top-class-super-secret-for-prescription-management-service
      JWT_EXPIRES_IN: 7d
      OTP_LENGTH: "6"
      OTP_EXPIRES_MIN: "5"
      UPLOAD_DIR: uploads
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GOOGLE_CLIENT_ID: "dummy-local-client-id"
      GOOGLE_CLIENT_SECRET: "dummy-local-secret"
      GOOGLE_CALLBACK_URL: "http://localhost:3050/api/auth/google/callback"
    volumes:
      - ./src:/app/src
      - ./assets:/app/assets
      - ./uploads:/app/uploads

volumes:
  mongo_data:
